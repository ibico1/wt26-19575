
<!DOCTYPE html>
<html lang="bs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontrolna lista</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Priprema za putovanje</h1>
    </header>

    <main>
        <section>
            <h2>Kontrolna lista</h2>

            <p id="brojac">Završeno: 0 / 6</p>

            <ul id="lista">
                <li>
                    <span>Spakovati odjeću</span>
                    <button>Označi kao završeno</button>
                </li>
                <li>
                    <span>Pripremiti dokumente</span>
                    <button>Označi kao završeno</button>
                </li>
                <li>
                    <span>Rezervisati smještaj</span>
                    <button>Označi kao završeno</button>
                </li>
                <li>
                    <span>Napraviti plan putovanja</span>
                    <button>Označi kao završeno</button>
                </li>
                <li>
                    <span>Napraviti spisak potrebnih stvari</span>
                    <button>Označi kao završeno</button>
                </li>
                <li>
                    <span>Provjeriti prevoz</span>
                    <button>Označi kao završeno</button>
                </li>
            </ul>

            <button id="reset">Vrati na početno stanje</button>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
